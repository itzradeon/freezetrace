name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FreezeTrace.sln

      - name: Build
        run: dotnet build FreezeTrace.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FreezeTrace.sln --configuration Release --no-build
