name: release

on:
  push:
    branches: [ main ]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'VERSION is empty.' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore FreezeTrace.sln

      - name: Build
        run: dotnet build FreezeTrace.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FreezeTrace.sln --configuration Release --no-build

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish src/FreezeTrace.Agent/FreezeTrace.Agent.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish/win-x64

          $archive = "FreezeTrace-v$env:VERSION-win-x64.zip"
          Compress-Archive -Path publish/win-x64/* -DestinationPath $archive -Force

          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File "FreezeTrace-v$env:VERSION-win-x64.sha256.txt" -Encoding ascii

      - name: Create GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; refusing to overwrite it."
            exit 0
          }

          gh release create $tag `
            "FreezeTrace-v$env:VERSION-win-x64.zip" `
            "FreezeTrace-v$env:VERSION-win-x64.sha256.txt" `
            --target $env:GITHUB_SHA `
            --title "FreezeTrace v$env:VERSION" `
            --notes-file RELEASE_NOTES.md `
            --prerelease
